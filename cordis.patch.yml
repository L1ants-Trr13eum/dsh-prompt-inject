# dsh-prompt-inject bundle patch.
#
# This file is the `dsh.bundle.patch` layer of the package: installing it through
# the official CLI (dsh plugin --profile <name> add <pkg-or-tarball>) reconciles
# `dsh.profile.bundles` against installed packages and, seeing this declaration,
# appends `dsh-prompt-inject` to the bundle stack. The profile boot then merges
# THIS patch (a single insert of the plugin row) exactly like the manual
# cordis.patch.yml mount line:
#
#   - insert:
#       - id: prompt-inject
#         name: dsh-prompt-inject
#
# Do not declare both at once (bundle + manual row): two Node halves would mount
# twice and both would register /api/prompt-inject/* (duplicate route).
- insert:
    - id: prompt-inject
      name: dsh-prompt-inject
